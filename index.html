<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nixie Bangers</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Orbitron", Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      text-align: center;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 1.5s ease-in-out forwards;
    }

    /* Hintergrund: Desktop */
    body {
      background: url('images/background-desktop.jpg') no-repeat center center fixed;
      background-size: cover;
      filter: blur(6px); /* Blur für beide Varianten */
    }

    /* Hintergrund: Mobile */
    @media (max-width: 768px) {
      body {
        background: url('images/background-mobile.jpg') no-repeat center center fixed;
        background-size: cover;
        filter: blur(6px);
      }
    }

    /* Container für Countdown / Info */
    .top-container {
      position: absolute;
      top: 12vh;
      width: 100%;
      padding: 0 2rem;
      text-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300, 0 0 40px #ff0000;
      opacity: 0;
      animation: fadeIn 2.5s ease-in-out forwards;
      animation-delay: 0.5s;
    }

    h1 {
      font-size: clamp(1.4rem, 4vw, 3rem);
      letter-spacing: 0.08em;
      margin-bottom: 0.3em;
    }

    #countdown {
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: 0.1em;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

  </style>
</head>

<body>

  <div class="top-container">
    <h1>Nixie Bangers – Location 2026</h1>
    <div id="countdown"></div>
  </div>

  <script>
    // Countdown-Ziel: 6. Dezember 2025 23:59:59
    const target = new Date(2025, 11, 6, 23, 59, 59).getTime();
    const countdownEl = document.getElementById("countdown");

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = target - now;

      if (diff <= 0) {
        // Wenn Countdown endet → Koordinaten anzeigen
        countdownEl.innerHTML = `
          📍 Hamburg<br>
          53.5511° N, 9.9937° E
        `;
        clearInterval(timer);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      countdownEl.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
