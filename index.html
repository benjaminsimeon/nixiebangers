<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nixie Bangers</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Orbitron", Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      text-align: center;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 1.5s ease-in-out forwards;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('images/background-desktop.png') no-repeat center center;
      background-size: cover;
      filter: blur(6px);
      z-index: -1;
      transition: filter 2s ease;
    }

    @media (max-width: 768px) {
      body::before {
        background: url('images/background-mobile.png') no-repeat center center;
        background-size: cover;
      }
    }

    .unblur::before {
      filter: none;
    }

    .top-container {
      position: relative;
      z-index: 1;
      width: 100%;
      margin-top: 12vh;
      padding: 0 2rem;
      text-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300, 0 0 40px #ff0000;
      opacity: 0;
      animation: fadeIn 2.5s ease-in-out forwards;
      animation-delay: 0.5s;
    }

    h1 {
      font-size: clamp(1.4rem, 4vw, 3rem);
      letter-spacing: 0.08em;
      margin-bottom: 0.3em;
    }

    #countdown {
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: 0.1em;
    }

    #countdown a {
      color: inherit;
      text-decoration: none;
    }

    #countdown a:hover {
      text-decoration: underline;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300; }
      50% { box-shadow: 0 0 20px #ff6600, 0 0 40px #ff3300; }
      100% { box-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300; }
    }

    #revealButton {
      animation: pulseGlow 2s infinite;
      margin-top: 1rem;
      padding: 0.7rem 1.5rem;
      font-size: 1.2rem;
      cursor: pointer;
      border: none;
      border-radius: 12px;       /* runde Ecken */
      background: linear-gradient(45deg, #ff6600, #ff3300);
      color: #fff;
      text-shadow: 0 0 5px #fff;
      box-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300;
      transition: all 0.3s ease;
    }
    
    #revealButton:hover {
      background: linear-gradient(45deg, #ff3300, #ff6600);
      transform: scale(1.05);
      box-shadow: 0 0 20px #ff6600, 0 0 30px #ff3300;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .reveal {
      opacity: 0;
      animation: revealFadeIn 6s ease forwards;
      animation-delay: 0.5s;
      display: inline-block;
    }

    @keyframes revealFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

  </style>
</head>

<body>

  <div class="top-container">
    <h1>Nixie Bangers – Location 2026</h1>
    <div id="countdown"></div>
    <button id="revealButton" style="display:none;">Reveal</button>
  </div>

  <!-- Audio -->
  <audio id="bgMusic" src="audio/background.mp3" preload="auto"></audio>

  <script>
    const countdownEl = document.getElementById("countdown");
    const revealBtn = document.getElementById("revealButton");
    const music = document.getElementById("bgMusic");

    // Countdown auf 6. Dezember 2025 12:00 MEZ (UTC+1)
    const targetDate = new Date(Date.UTC(2025, 8, 6, 11, 0, 0));
    let target = targetDate.getTime();

    const now = new Date().getTime();
    if (target - now <= 0) {
      target = now + 10 * 1000; // Mindestens 10 Sekunden Countdown
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = target - now;

      if (diff <= 0) {
        clearInterval(timer);
        // Countdown vorbei → Button anzeigen
        countdownEl.textContent = '';
        revealBtn.style.display = 'inline-block';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      countdownEl.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    // Reveal-Button Klick
    revealBtn.addEventListener('click', () => {
      document.body.classList.add('unblur');
      countdownEl.innerHTML = `
        <span class="reveal">📍 Hamburg<br>
        <a href="https://maps.app.goo.gl/nRRxy8nKheQZ59yu8" target="_blank">
          37.711827, 24.055645
        </a></span>
      `;
      revealBtn.style.display = 'none';

      // Musik starten
      music.play().catch(() => {
        console.log("Autoplay blockiert, Benutzer muss klicken");
      });
    });
  </script>

</body>
</html>
