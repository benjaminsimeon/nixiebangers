<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nixie Bangers</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Orbitron", Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      text-align: center;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 1.5s ease-in-out forwards;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('images/background-desktop.png') no-repeat center center;
      background-size: cover;
      filter: blur(6px);
      z-index: -1;
      transition: filter 2s ease;
    }

    @media (max-width: 768px) {
      body::before {
        background: url('images/background-mobile.png') no-repeat center center;
        background-size: cover;
      }
    }

    .unblur::before {
      filter: none;
    }

    .top-container {
      position: relative;
      z-index: 1;
      width: 100%;
      margin-top: 12vh;
      padding: 0 2rem;
      text-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300, 0 0 40px #ff0000;
      opacity: 0;
      animation: fadeIn 2.5s ease-in-out forwards;
      animation-delay: 0.5s;
    }

    h1 {
      font-size: clamp(1.4rem, 4vw, 3rem);
      letter-spacing: 0.08em;
      margin-bottom: 0.3em;
    }

    #countdown {
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: 0.1em;
    }

    #countdown a {
      color: inherit;
      text-decoration: underline;
    }

    #countdown a:hover {
      text-decoration: underline;
    }

    /* Fade-In Animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Reveal für Lavrion Koordinaten */
    .reveal {
      opacity: 0;                            /* Start: unsichtbar */
      animation: revealFadeIn 4s ease forwards;  /* Dauer 4 Sekunden, nur Fade-In */
      animation-delay: 0.5s;                 /* optional: leichtes Verzögern */
      display: inline-block;
    }

    @keyframes revealFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<body>

  <div class="top-container">
    <h1>Nixie Bangers – Location 2026</h1>
    <div id="countdown"></div>
  </div>

  <script>
    const countdownEl = document.getElementById("countdown");

    // 6. Dezember 2025, 12:00 MEZ (UTC+1)
    const targetDate = new Date(Date.UTC(2025, 9, 6, 11, 0, 0));
    let target = targetDate.getTime();

    const now = new Date().getTime();
    if (target - now <= 0) {
      target = now + 10 * 1000; // mindestens 10 Sekunden Countdown
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = target - now;

      if (diff <= 0) {
        document.body.classList.add("unblur");

        // Fade-In Koordinaten
        countdownEl.innerHTML = `
          <span class="reveal">📍 Hamburg<br>
          <a href="https://maps.app.goo.gl/nRRxy8nKheQZ59yu8" target="_blank">
            37.711827, 24.055645
          </a></span>
        `;
        clearInterval(timer);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      countdownEl.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
