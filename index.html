<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nixie Bangers</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #000 60%, #111 100%);
      color: #fff;
      font-family: "Orbitron", Arial, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    .screen {
      position: absolute;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      text-align: center;
      width: 100%;
    }

    .show {
      opacity: 1;
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 0.05em;
    }

    #countdown {
      font-size: 2rem;
      letter-spacing: 0.1em;
      margin-top: 0.5em;
    }

    .glow {
      text-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300, 0 0 40px #ff0000;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }

    .pulse {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div id="nixie" class="screen glow">
    <h1>nixie Bangers</h1>
  </div>

  <div id="location" class="screen glow">
    <h1>Location 2026</h1>
  </div>

  <div id="coming" class="screen glow">
    <h1>Coming Soon</h1>
    <div id="countdown"></div>
  </div>

  <script>
    const nixie = document.getElementById('nixie');
    const locationDiv = document.getElementById('location');
    const coming = document.getElementById('coming');
    const countdownEl = document.getElementById('countdown');

    // Zeitsteuerung
    const timings = {
      nixieIn: 0,
      nixieOut: 4000,
      locationIn: 5500,
      locationOut: 9500,
      comingIn: 11000
    };

    // Sequenz anzeigen (ohne Überlappung)
    setTimeout(() => nixie.classList.add('show', 'pulse'), timings.nixieIn);
    setTimeout(() => nixie.classList.remove('show', 'pulse'), timings.nixieOut);

    setTimeout(() => locationDiv.classList.add('show', 'pulse'), timings.locationIn);
    setTimeout(() => locationDiv.classList.remove('show', 'pulse'), timings.locationOut);

    setTimeout(() => coming.classList.add('show', 'pulse'), timings.comingIn);

    // Countdown bis 6. Dezember 23:59:59
    const targetDate = new Date(new Date().getFullYear(), 11, 6, 23, 59, 59).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        countdownEl.innerHTML = '🎉 Heute ist der 6. Dezember!';
        clearInterval(timer);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      countdownEl.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
