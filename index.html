<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nixie Bangers Countdown</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #000 60%, #111 100%);
      color: #fff;
      font-family: "Orbitron", Arial, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    .sequence {
      position: relative;
      text-align: center;
      width: 100%;
    }

    .screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      width: 100%;
      animation: fadeSequence 15s linear forwards;
    }

    /* Phasen-Steuerung */
    #nixie { animation-delay: 0s; }
    #location { animation-delay: 4.5s; }
    #coming { animation-delay: 9s; }

    /* Fade-In / Fade-Out Übergänge */
    @keyframes fadeSequence {
      0% { opacity: 0; }
      10% { opacity: 1; }
      30% { opacity: 1; }
      40% { opacity: 0; }
      100% { opacity: 0; }
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 0.05em;
      text-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300, 0 0 40px #ff0000;
    }

    #countdown {
      font-size: 2rem;
      letter-spacing: 0.1em;
      margin-top: 0.5em;
      text-shadow: 0 0 10px #ff6600, 0 0 20px #ff3300;
    }
  </style>
</head>
<body>
  <div class="sequence">
    <div id="nixie" class="screen"><h1>nixie Bangers</h1></div>
    <div id="location" class="screen"><h1>Location 2026</h1></div>
    <div id="coming" class="screen">
      <h1>Coming Soon</h1>
      <div id="countdown"></div>
    </div>
  </div>

  <script>
    const countdownEl = document.getElementById('countdown');
    const targetDate = new Date(new Date().getFullYear(), 11, 6, 23, 59, 59).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        countdownEl.innerHTML = '🎉 Heute ist der 6. Dezember!';
        clearInterval(timer);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      countdownEl.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
